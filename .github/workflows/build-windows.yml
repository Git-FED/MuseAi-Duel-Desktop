name: Build Muse Number Two Windows Desktop App

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find and build Windows desktop app
        shell: bash
        run: |
          set -euo pipefail
          desktop_dir="$(dirname "$(find . -type f -path '*/desktop-electron/package.json' -print -quit)")"
          test -n "$desktop_dir" && test -f "$desktop_dir/package-lock.json"
          echo "Electron project: $desktop_dir"
          (cd "$desktop_dir" && npm ci && npm run dist)
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muse-number-two-windows
          path: '**/desktop-electron/dist/*'
          if-no-files-found: error
