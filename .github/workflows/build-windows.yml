name: Build Muse Number Two Windows Desktop App

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-desktop:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find Windows desktop app
        id: desktop
        shell: bash
        run: |
          set -euo pipefail

          package_file="$(find . -type f \
            -path '*/desktop-electron/package.json' \
            -not -path '*/node_modules/*' \
            -print -quit)"

          if [[ -z "$package_file" ]]; then
            echo "::error::Could not find desktop-electron/package.json in the checked-out repository."
            echo "Available package.json files:"
            find . -type f -name package.json \
              -not -path '*/node_modules/*' -print
            exit 1
          fi

          desktop_dir="$(dirname "$package_file")"
          echo "Electron project: $desktop_dir"

          if [[ ! -f "$desktop_dir/package-lock.json" ]]; then
            echo "::error::Missing $desktop_dir/package-lock.json. Generate and commit the lockfile before using npm ci."
            exit 1
          fi

          echo "dir=$desktop_dir" >> "$GITHUB_OUTPUT"

      - name: Install desktop dependencies
        shell: bash
        working-directory: ${{ steps.desktop.outputs.dir }}
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci

      - name: Build Windows desktop app
        shell: bash
        working-directory: ${{ steps.desktop.outputs.dir }}
        run: |
          set -euo pipefail
          npm run dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muse-number-two-windows
          path: '${{ steps.desktop.outputs.dir }}/dist/*'
          if-no-files-found: error
